# Render Blueprint for Backend Deployment
# This file can be used with Render's Blueprint feature for automated setup

services:
  - type: web
    name: ats-resume-analyzer-api
    runtime: python
    plan: starter  # Can upgrade to standard/pro for better performance
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ats-db
          property: connectionString
      - key: DEBUG
        value: false
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MODEL_CACHE_DIR
        value: ./model_cache
      - key: MAX_UPLOAD_SIZE
        value: 10485760  # 10MB in bytes
      - key: PYTHON_VERSION
        value: 3.10

databases:
  - name: ats-db
    plan: starter  # PostgreSQL database
    databaseName: ats_db
    user: ats_user


